steps:
  # Step 1: Lint (optional - add if you use flake8 or similar)
  - name: 'gcr.io/cloud-builders/pip'
    entrypoint: pip
    args: ['install', 'flake8']

  - name: 'gcr.io/cloud-builders/python'
    entrypoint: flake8
    args: ['.']

  # Step 2: Run unit tests (optional - add tests if available)
  - name: 'gcr.io/cloud-builders/python'
    entrypoint: python
    args: ['-m', 'unittest', 'discover']

  # Step 3: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/csv-metrics-service', '.']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'csv-metrics-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/csv-metrics-service'
      - '--region'
      - 'us-central1'  # Change if using a different region
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'cloud-build-deployer@YOUR_PROJECT_ID.iam.gserviceaccount.com'  # Replace with actual SA email

images:
  - 'gcr.io/$PROJECT_ID/csv-metrics-service'
options:
  logging: CLOUD_LOGGING_ONLY
