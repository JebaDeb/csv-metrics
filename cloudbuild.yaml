steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/csv-metrics-service', '.']

  # Step 2: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'csv-metrics-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/csv-metrics-service'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'cloud-build-deployer@YOUR_PROJECT_ID.iam.gserviceaccount.com'
      -
options:
  logging: CLOUD_LOGGING_ONLY
